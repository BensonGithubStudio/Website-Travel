<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- PWA: installability -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#D6431F">

<!-- PWA: favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="shortcut icon" href="icons/favicon.ico">

<!-- PWA: iOS "Add to Home Screen" support (iOS ignores the manifest) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅行日誌">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/navigation.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/states.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/toast.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- 登入畫面：預設就是「open」，未登入前會蓋住整個頁面，登入成功才會移除 -->
<div class="overlay open" id="loginOverlay">
  <div class="login-card">
    <div class="login-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M12 3.5c2.3 2.4 3.5 5.4 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.4-3.5-8.5S9.7 5.9 12 3.5z"/>
        <path d="M3.8 12h16.4"/>
      </svg>
    </div>
    <h2 class="login-title">管理員登入</h2>
    <p class="login-desc">目前僅開放管理員及部分人員瀏覽，請輸入帳號密碼登入</p>

    <form id="loginForm" novalidate>
      <div class="login-field">
        <svg class="login-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.6"/>
          <path d="M4.5 20c.7-4 3.8-6.4 7.5-6.4s6.8 2.4 7.5 6.4"/>
        </svg>
        <input type="text" id="lUsername" placeholder="帳號" autocomplete="username" required>
      </div>
      <div class="login-field">
        <svg class="login-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2.2"/>
          <path d="M8 11V7.8a4 4 0 0 1 8 0V11"/>
        </svg>
        <input type="password" id="lPassword" placeholder="密碼" autocomplete="current-password" required>
      </div>
      <div class="login-error" id="loginError" style="display:none;"></div>
      <button type="submit" class="login-submit" id="btnLoginSubmit">登入</button>
    </form>
  </div>
</div>

<div class="utility-bar">
  <div class="utility-inner">
    <span id="todayLine"></span>
    <span id="countLine">共 0 則日誌</span>
    <button id="btnLogout" class="btn-logout" type="button" style="display:none;">登出</button>
  </div>
</div>

<div class="masthead">
  <h1 class="masthead-title">旅行日誌</h1>
  <p class="masthead-sub">旅行日誌，紀錄著旅行的回憶、細節、風俗，和忍不住想講的心得</p>
</div>

<div class="stat-strip" id="statStrip"></div>

<div class="wrap">
  <div class="nav-bar">
    <div class="country-row" id="countryRow"></div>
    <div class="filter-row">
      <div class="cat-chips" id="catChips"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="搜尋國家或關鍵字">
        </div>
        <button class="btn-add" id="btnAdd" aria-label="投稿一則" title="投稿一則">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn-label">我想紀錄</span>
        </button>
      </div>
    </div>
  </div>

  <div id="content">
    <div class="loading">正在載入日誌紀錄…</div>
  </div>
</div>

<div class="overlay" id="formOverlay">
  <form class="sheet" id="entryForm">
    <div class="form-header">
      <h2 class="form-title" id="formTitle">投稿一則日誌</h2>
      <button type="button" class="btn-close" id="btnCloseFormTop" aria-label="取消並關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="field">
      <label>分類</label>
      <div class="cat-toggle" id="catToggle"></div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="fCountry">國家 *</label>
        <input type="text" id="fCountry" placeholder="例如：韓國" required>
      </div>
      <div class="field">
        <label for="fRegion">地區／城市</label>
        <input type="text" id="fRegion" placeholder="例如：首爾">
      </div>
    </div>

    <div class="field">
      <label for="fTitle">標題 *</label>
      <input type="text" id="fTitle" placeholder="例如：吃飯的時候，碗千萬別端起來" required>
    </div>

    <div class="field">
      <label for="fContent">內容</label>
      <textarea id="fContent" placeholder="說明清楚一點，之後回頭看才記得住細節……"></textarea>
    </div>

    <div class="field">
      <label for="fDate">日期</label>
      <input type="date" id="fDate">
    </div>

    <div class="row-submit">
      <div class="field">
        <label for="fCompanions">同行家人</label>
        <input type="text" id="fCompanions" placeholder="例如：爸爸、媽媽">
      </div>
      <button type="submit" class="btn-primary">發布</button>
    </div>
  </form>
</div>

<div class="overlay" id="detailOverlay">
  <div class="sheet" id="detailSheet"></div>
</div>

<div class="toast" id="toast"></div>

<!-- auth.js 一定要排在最前面，才能在其他腳本發出任何請求前先把 fetch 攔截好 -->
<script src="js/auth.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/filters.js"></script>
<script src="js/render.js"></script>
<script src="js/form.js"></script>
<script src="js/detail.js"></script>
<script src="js/main.js"></script>

<script>
  // PWA: register service worker (enables offline + install prompt on Android/desktop)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
