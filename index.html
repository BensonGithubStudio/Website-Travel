<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/navigation.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/states.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/detail.css">
<link rel="stylesheet" href="css/toast.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="utility-bar">
  <div class="utility-inner">
    <span id="todayLine"></span>
    <span id="countLine">共 0 則日誌</span>
  </div>
</div>

<div class="masthead">
  <h1 class="masthead-title">旅行日誌</h1>
  <p class="masthead-sub">旅行日誌，紀錄著旅行的回憶、細節、風俗，和忍不住想講的心得</p>
</div>

<div class="stat-strip" id="statStrip"></div>

<div class="wrap">
  <div class="nav-bar">
    <div class="country-row" id="countryRow"></div>
    <div class="filter-row">
      <div class="cat-chips" id="catChips"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="搜尋國家或關鍵字">
        </div>
        <button class="btn-add" id="btnAdd" aria-label="投稿一則" title="投稿一則">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn-label">我想紀錄</span>
        </button>
      </div>
    </div>
  </div>

  <div id="content">
    <div class="loading">正在載入日誌紀錄…</div>
  </div>
</div>

<div class="overlay" id="formOverlay">
  <form class="sheet" id="entryForm">
    <div class="form-header">
      <h2 class="form-title" id="formTitle">投稿一則日誌</h2>
      <button type="button" class="btn-close" id="btnCloseFormTop" aria-label="取消並關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="field">
      <label>分類</label>
      <div class="cat-toggle" id="catToggle"></div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="fCountry">國家 *</label>
        <input type="text" id="fCountry" placeholder="例如：韓國" required>
      </div>
      <div class="field">
        <label for="fRegion">地區／城市</label>
        <input type="text" id="fRegion" placeholder="例如：首爾">
      </div>
    </div>

    <div class="field">
      <label for="fTitle">標題 *</label>
      <input type="text" id="fTitle" placeholder="例如：吃飯的時候，碗千萬別端起來" required>
    </div>

    <div class="field">
      <label for="fContent">內容</label>
      <textarea id="fContent" placeholder="說明清楚一點，之後回頭看才記得住細節……"></textarea>
    </div>

    <div class="row2 row-date-companions">
      <div class="field">
        <label for="fDate">日期</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label for="fCompanions">同行家人</label>
        <input type="text" id="fCompanions" placeholder="例如：爸爸、媽媽">
      </div>
    </div>

    <div class="row-submit">
      <button type="submit" class="btn-primary">發布</button>
    </div>
  </form>
</div>

<div class="overlay" id="detailOverlay">
  <div class="sheet" id="detailSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/filters.js"></script>
<script src="js/render.js"></script>
<script src="js/form.js"></script>
<script src="js/detail.js"></script>
<script src="js/main.js"></script>
</body>
</html>
