<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FFFCF4;
    --paper-2: #FBF6E8;
    --ink: #221D14;
    --ink-soft: #6F6656;
    --rule: #E4DAC0;
    --rule-strong: #221D14;
    --brand: #D6431F;
    --brand-deep: #A83313;
    --brand-soft: #FBE4DB;

    --c-exit: #2454A6;      --c-exit-soft: #E5ECF9;
    --c-customs: #1D8A6C;   --c-customs-soft: #E2F3EC;
    --c-precaution: #B5720E;--c-precaution-soft: #FBF0D8;
    --c-reflection: #B23568;--c-reflection-soft: #F9E3EC;

    --font-display: 'Noto Serif TC', Georgia, 'PingFang TC', serif;
    --font-body: 'Noto Sans TC', -apple-system, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    min-height: 100vh;
  }
  ::selection{ background: var(--brand); color: #fff; }
  :focus-visible{ outline: 2px solid var(--brand); outline-offset: 2px; }
  button{ font-family: inherit; cursor: pointer; }
  textarea, input, select{ font-family: inherit; }
  a{ color: inherit; }

  .wrap{ max-width: 1100px; margin: 0 auto; padding: 0 20px 90px; }

  /* ---------- UTILITY BAR ---------- */
  .utility-bar{
    border-bottom: 1px solid var(--rule);
    font-size: 12.5px; color: var(--ink-soft);
  }
  .utility-inner{
    max-width: 1100px; margin: 0 auto; padding: 10px 20px;
    display:flex; justify-content: space-between; align-items:center; flex-wrap:wrap; gap:6px;
  }

  /* ---------- MASTHEAD ---------- */
  .masthead{ text-align:center; padding: 34px 20px 22px; border-bottom: 4px double var(--rule-strong); }
  .masthead-title{
    font-family: var(--font-display); font-weight: 900; letter-spacing: 0.01em;
    font-size: clamp(32px, 6vw, 54px); margin: 0 0 10px; color: var(--ink);
  }
  .masthead-sub{ font-size: 15px; color: var(--ink-soft); max-width: 46ch; margin: 0 auto; }

  /* ---------- STAT STRIP ---------- */
  .stat-strip{
    display:flex; flex-wrap:wrap; gap: 18px; justify-content:center;
    padding: 16px 20px; border-bottom: 1px solid var(--rule); font-size: 13.5px;
  }
  .stat-strip .item{ display:flex; align-items:center; gap:7px; color: var(--ink-soft); }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; }

  /* ---------- NAV ---------- */
  .nav-bar{ padding: 18px 0 6px; }
  .country-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .country-row::-webkit-scrollbar{ height:5px; }
  .country-row::-webkit-scrollbar-thumb{ background: var(--rule); border-radius:4px; }
  .pill{
    flex-shrink:0; background: transparent; border: 1.5px solid var(--rule-strong); color: var(--ink);
    padding: 7px 16px; border-radius: 999px; font-size: 13.5px; font-weight:600; white-space:nowrap;
    transition: background .15s, color .15s;
  }
  .pill.active{ background: var(--ink); color: var(--paper); }
  .pill:hover:not(.active){ background: var(--paper-2); }

  .filter-row{ display:flex; justify-content: space-between; align-items:center; gap: 14px; flex-wrap:wrap; margin: 10px 0 6px; }
  .cat-chips{ display:flex; gap:7px; flex-wrap:wrap; }
  .cat-chip{
    border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink-soft);
    padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight:600;
    display:flex; align-items:center; gap:6px; transition: all .15s;
  }
  .cat-chip:hover{ border-color: var(--ink-soft); }
  .cat-chip.active{ color:#fff; border-color: transparent; }

  .search-box{
    display:flex; align-items:center; gap:8px; border: 1.5px solid var(--rule-strong); border-radius: 999px;
    padding: 7px 14px; min-width: 200px; flex: 0 1 260px;
  }
  .search-box svg{ width:15px; height:15px; opacity:0.6; flex-shrink:0; }
  .search-box input{ border:none; background:none; font-size: 13.5px; width:100%; color: var(--ink); }
  .search-box input:focus{ outline:none; }

  .btn-add{
    background: var(--brand); color:#fff; border:none; border-radius: 999px; padding: 10px 20px;
    font-size: 14px; font-weight:700; display:flex; align-items:center; gap:8px; white-space:nowrap;
    transition: background .15s, transform .15s;
  }
  .btn-add:hover{ background: var(--brand-deep); transform: translateY(-1px); }
  .btn-add svg{ width:16px; height:16px; }

  /* ---------- CONTENT ---------- */
  #content{ margin-top: 18px; }

  .lead{
    display:grid; grid-template-columns: 6px 1fr; gap: 18px; margin-bottom: 30px; cursor:pointer;
    padding: 22px 22px 22px 0; border: 1px solid var(--rule); background: var(--paper-2);
  }
  .lead:hover{ background: #F5EED9; }
  .lead .bar{ border-radius: 3px; }
  .latest-label{
    display:flex; align-items:center; width:fit-content; background:var(--brand); color:#fff;
    padding:3px 9px; margin-bottom:8px; font-size:11px; font-weight:700; letter-spacing:.12em; line-height:1.4;
  }
  .lead-kicker{ font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; color:#fff; margin-bottom:10px; }
  .lead h2{ font-family: var(--font-display); font-size: clamp(22px,3vw,30px); margin:0 0 10px; font-weight:700; line-height:1.35; }
  .lead .meta{ font-size:13px; color: var(--ink-soft); margin: 0 0 10px; }
  .lead p.excerpt{ font-size:15px; color: var(--ink); opacity:0.88; margin:0; max-width: 70ch; }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(270px,1fr)); gap: 20px; }

  .card{
    background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--ink);
    padding: 18px 18px 16px; cursor:pointer; transition: transform .16s, box-shadow .16s, border-color .16s;
    display:flex; flex-direction:column; min-height: 168px;
  }
  .card:hover{ transform: translateY(-3px); box-shadow: 0 10px 22px rgba(34,29,20,0.12); }
  .card-kicker{ font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; color:#fff; margin-bottom:10px; width:fit-content; }
  .card .country-line{ font-size:12.5px; color: var(--ink-soft); margin: 0 0 4px; font-weight:600; }
  .card h3{ font-family: var(--font-display); font-size:17.5px; margin:0 0 8px; font-weight:700; line-height:1.4; }
  .card p.excerpt{ font-size:13.5px; color: var(--ink); opacity:0.82; margin:0; flex:1;
    line-height:1.6; max-height:4.8em; overflow:hidden; }
  .card .meta{ font-size:11.5px; color: var(--ink-soft); margin-top:10px; }

  /* ---------- EMPTY / LOADING / ERROR ---------- */
  .empty{ text-align:center; padding: 70px 20px; color: var(--ink-soft); }
  .empty svg{ width:52px; height:52px; opacity:0.4; margin-bottom:16px; }
  .empty h3{ font-family: var(--font-display); font-size:21px; color: var(--ink); margin:0 0 8px; font-weight:700; }
  .empty p{ margin:0 0 20px; font-size:14px; }
  .loading{ text-align:center; padding: 70px 20px; color: var(--ink-soft); font-size:14px; }
  .error-box{
    background: var(--brand-soft); border: 1px solid rgba(214,67,31,0.4); color: var(--brand-deep);
    padding: 16px 18px; border-radius: 8px; margin: 20px 0; font-size:14px;
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .error-box button{ background: var(--ink); color:#fff; border:none; padding:7px 14px; border-radius: 6px; font-size:13px; font-weight:600; }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(34,29,20,0.5); backdrop-filter: blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    opacity:0; pointer-events:none; transition: opacity .18s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  @media (min-width:720px){ .overlay{ align-items:center; } }

  .sheet{
    background: var(--paper); color: var(--ink); width:100%; max-width: 640px;
    max-height: 92vh; overflow-y:auto; border-radius: 10px 10px 0 0;
    padding: 30px 26px 26px; transform: translateY(24px); transition: transform .2s ease;
  }
  .overlay.open .sheet{ transform: translateY(0); }
  @media (min-width:720px){ .sheet{ border-radius: 10px; } }

  .sheet h2.form-title{ font-family: var(--font-display); font-size:24px; margin:0; font-weight:700; }
  .form-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:20px; }
  .btn-close{
    background:none; border:none; padding:4px; line-height:0; color: var(--ink-soft);
    flex-shrink:0; border-radius:6px; transition: color .15s, background .15s;
  }
  .btn-close:hover{ color: var(--ink); background: var(--paper-2); }
  .btn-close svg{ width:20px; height:20px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13px; font-weight:700; color: var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%; border:1.5px solid var(--rule); background:#fff; border-radius:6px;
    padding:10px 12px; font-size:14px; color: var(--ink); resize:vertical;
  }
  .field input[type=date]{ font-family: inherit; }
  .field input:focus, .field textarea:focus{ outline:none; border-color: var(--ink-soft); }
  .field textarea{ min-height: 90px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:480px){ .row2{ gap:10px; } }

  .cat-toggle{ display:flex; gap:8px; flex-wrap:wrap; }
  .cat-toggle button{
    flex: 1 1 auto; padding:10px 8px; border-radius:8px; border:1.5px solid var(--rule); background:#fff;
    font-size:12.5px; font-weight:700; color: var(--ink-soft); transition: all .15s;
  }
  .cat-toggle button.is-active{ color:#fff; border-color: transparent; }

  .sheet-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .btn-secondary{ background: transparent; border:1.5px solid var(--rule-strong); color: var(--ink); padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; }
  .btn-secondary:hover{ background: var(--paper-2); }
  .btn-primary{ background: var(--ink); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:14px; font-weight:700; }
  .btn-primary:hover{ background:#000; }

  /* ---------- DETAIL ---------- */
  .detail-kicker{ font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px; padding:5px 13px; border-radius:999px; color:#fff; margin-bottom:14px; }
  .detail-country{ font-size:13.5px; color: var(--ink-soft); font-weight:600; margin: 0 0 4px; }
  .detail-title{ font-family: var(--font-display); font-size:26px; font-weight:700; margin:0 0 10px; line-height:1.35; }
  .detail-meta{ font-size:13px; color: var(--ink-soft); margin: 0 0 20px; }
  .detail-body{ font-size:15.5px; color: var(--ink); white-space: pre-wrap; margin: 0 0 24px; }
  .detail-footer{ display:flex; justify-content: space-between; align-items:center; border-top:1px solid var(--rule); padding-top:18px; gap:10px; flex-wrap:wrap; }
  .detail-footer .left-actions{ display:flex; gap:8px; }
  .btn-danger{ background: transparent; color: var(--brand-deep); border:1.5px solid rgba(214,67,31,0.4); padding:9px 16px; border-radius:8px; font-size:13px; font-weight:700; }
  .btn-danger:hover{ background: var(--brand-soft); }
  .confirm-row{ display:flex; align-items:center; gap:10px; font-size:13px; color: var(--brand-deep); flex-wrap:wrap; }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:24px; right:24px; background: var(--ink); color:#fff; padding:12px 20px;
    border-radius:8px; font-size:13.5px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); z-index:100;
    transform: translateY(20px); opacity:0; transition: transform .2s, opacity .2s; pointer-events:none;
  }
  .toast.show{ transform: translateY(0); opacity:1; }

  /* ---------- BALANCED MOBILE LAYOUT ---------- */
  @media (max-width:719px){
    /* Keep the newspaper identity and leave room for the hierarchy to breathe. */
    .utility-inner{ padding:7px 14px; font-size:11.5px; gap:4px 10px; }
    .masthead{ padding:18px 16px 16px; border-bottom-width:3px; }
    .masthead-title{ font-size:30px; line-height:1.3; margin-bottom:5px; }
    .masthead-sub{ font-size:13px; line-height:1.65; max-width:34ch; }

    .stat-strip{
      flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto; gap:14px;
      padding:10px 14px; font-size:11.5px; white-space:nowrap; scrollbar-width:none;
    }
    .stat-strip::-webkit-scrollbar{ display:none; }

    .wrap{ padding:0 14px 88px; }
    .nav-bar{ padding:12px 0 4px; }
    .country-row{ gap:8px; padding-bottom:8px; }
    .country-row::-webkit-scrollbar{ display:none; }
    .pill{ padding:6px 13px; font-size:12px; border-width:1px; }

    .filter-row{ display:block; margin:7px 0 0; }
    .cat-chips{ flex-wrap:nowrap; overflow-x:auto; gap:7px; padding:0 0 9px; scrollbar-width:none; }
    .cat-chips::-webkit-scrollbar{ display:none; }
    .cat-chip{ flex:0 0 auto; padding:5px 11px; font-size:11.5px; border-width:1px; gap:4px; }
    .filter-row > div:last-child{ display:block !important; }
    .search-box{ min-width:0; max-width:none; width:100%; padding:8px 13px; }
    .search-box input{ font-size:12.5px; }

    /* The composer is always nearby without consuming filter-row height. */
    .btn-add{
      position:fixed; right:max(16px, env(safe-area-inset-right)); bottom:max(16px, env(safe-area-inset-bottom));
      z-index:40; width:56px; height:56px; padding:0; border-radius:50%; justify-content:center;
      box-shadow:0 8px 20px rgba(168,51,19,.34);
    }
    .btn-add svg{ width:25px; height:25px; }
    .btn-add .btn-label{ display:none; }
    .btn-add:focus-visible{ outline-color:var(--ink); outline-offset:3px; }

    #content{ margin-top:16px; }
    .lead{ grid-template-columns:4px 1fr; gap:14px; margin-bottom:18px; padding:18px 16px 18px 0; }
    .latest-label{ padding:3px 8px; margin-bottom:7px; font-size:10.5px; }
    .lead-kicker{ font-size:11px; padding:3px 9px; margin-bottom:8px; }
    .lead h2{ font-size:21px; margin-bottom:7px; }
    .lead .meta{ font-size:11.5px; margin-bottom:7px; }
    .lead p.excerpt{ font-size:13px; line-height:1.55; max-height:3.1em; overflow:hidden; }

    .grid{ grid-template-columns:1fr; gap:14px; }
    .card{ min-height:0; padding:15px 15px 14px; border-left-width:4px; }
    .card-kicker{ font-size:10.5px; padding:3px 8px; margin-bottom:7px; }
    .card .country-line{ font-size:11.5px; margin-bottom:3px; }
    .card h3{ font-size:16px; margin-bottom:6px; }
    .card p.excerpt{ font-size:12.5px; line-height:1.5; max-height:3em; }
    .card .meta{ font-size:10.5px; margin-top:8px; }

    .empty, .loading{ padding:42px 14px; }
    .error-box{ margin:10px 0; padding:12px; font-size:13px; }

    .sheet{ max-height:90vh; padding:20px 16px calc(16px + env(safe-area-inset-bottom)); }
    .sheet h2.form-title{ font-size:21px; }
    .form-header{ margin-bottom:14px; }
    .field{ margin-bottom:11px; }
    .field textarea{ min-height:72px; }
    .sheet-actions{ margin-top:16px; }
    .detail-kicker{ margin-bottom:8px; }
    .detail-title{ font-size:22px; margin-bottom:6px; }
    .detail-meta{ margin-bottom:12px; }
    .detail-body{ font-size:14px; margin-bottom:16px; }
    .detail-footer{ padding-top:12px; }

    .toast{ right:14px; bottom:84px; max-width:calc(100vw - 28px); }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .lead, .overlay, .sheet, .toast, .btn-add, .pill{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="utility-bar">
  <div class="utility-inner">
    <span id="todayLine"></span>
    <span id="countLine">共 0 則日誌</span>
  </div>
</div>

<div class="masthead">
  <h1 class="masthead-title">旅行日誌</h1>
  <p class="masthead-sub">旅行日誌，紀錄著旅行的回憶、細節、風俗，和忍不住想講的心得</p>
</div>

<div class="stat-strip" id="statStrip"></div>

<div class="wrap">
  <div class="nav-bar">
    <div class="country-row" id="countryRow"></div>
    <div class="filter-row">
      <div class="cat-chips" id="catChips"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="搜尋國家或關鍵字">
        </div>
        <button class="btn-add" id="btnAdd" aria-label="投稿一則" title="投稿一則">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn-label">我想紀錄</span>
        </button>
      </div>
    </div>
  </div>

  <div id="content">
    <div class="loading">正在載入日誌紀錄…</div>
  </div>
</div>

<div class="overlay" id="formOverlay">
  <form class="sheet" id="entryForm">
    <div class="form-header">
      <h2 class="form-title" id="formTitle">投稿一則日誌</h2>
      <button type="button" class="btn-close" id="btnCloseFormTop" aria-label="取消並關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>

    <div class="field">
      <label>分類</label>
      <div class="cat-toggle" id="catToggle"></div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="fCountry">國家 *</label>
        <input type="text" id="fCountry" placeholder="例如：韓國" required>
      </div>
      <div class="field">
        <label for="fRegion">地區／城市</label>
        <input type="text" id="fRegion" placeholder="例如：首爾">
      </div>
    </div>

    <div class="field">
      <label for="fTitle">標題 *</label>
      <input type="text" id="fTitle" placeholder="例如：吃飯的時候，碗千萬別端起來" required>
    </div>

    <div class="field">
      <label for="fContent">內容</label>
      <textarea id="fContent" placeholder="說明清楚一點，之後回頭看才記得住細節……"></textarea>
    </div>

    <div class="row2">
      <div class="field">
        <label for="fDate">日期</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label for="fCompanions">同行家人</label>
        <input type="text" id="fCompanions" placeholder="例如：爸爸、媽媽">
      </div>
    </div>

    <div class="sheet-actions">
      <button type="submit" class="btn-primary">發布</button>
    </div>
  </form>
</div>

<div class="overlay" id="detailOverlay">
  <div class="sheet" id="detailSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var CATS = {
    exit:       { label:'出入境須知', color:'var(--c-exit)',       hex:'#2454A6' },
    customs:    { label:'當地風俗',   color:'var(--c-customs)',    hex:'#1D8A6C' },
    precaution: { label:'注意事項',   color:'var(--c-precaution)', hex:'#B5720E' },
    reflection: { label:'旅遊心得',   color:'var(--c-reflection)', hex:'#B23568' }
  };
  var CAT_ORDER = ['exit','customs','precaution','reflection'];

  var state = { entries: [], country: 'all', category: 'all', search: '', formCategory: 'customs', editingId: null, deleteConfirmId: null };

  var content = document.getElementById('content');
  var formOverlay = document.getElementById('formOverlay');
  var detailOverlay = document.getElementById('detailOverlay');
  var detailSheet = document.getElementById('detailSheet');
  var entryForm = document.getElementById('entryForm');
  var toastEl = document.getElementById('toast');

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,9);
  }
  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  document.getElementById('todayLine').textContent = new Intl.DateTimeFormat('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' }).format(new Date());

  // ---------- STORAGE (Google Sheet via Apps Script Web App) ----------
  // 把「已部署的 Apps Script 網頁應用程式」網址貼在這裡（結尾是 /exec）
  var API_URL = 'https://script.google.com/macros/s/AKfycbwtiqcMvGUINxD5kiREQ8tei_pyYXFJUT1XRbnReDzXTTUlM6qXSFSANvSJAjqnCPnS/exec';

  async function loadEntries(){
    content.innerHTML = '<div class="loading">正在排版今天的頭條…</div>';
    try{
      var res = await fetch(API_URL);
      var json = await res.json();
      if(!json || !json.ok) throw new Error((json && json.error) ? json.error : '讀取失敗（後端未回傳錯誤訊息）');
      var entries = json.entries || [];
      entries.forEach(function(e){ e.createdAt = Number(e.createdAt) || 0; });
      entries.sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
      state.entries = entries;
      renderAll();
    }catch(e){
      content.innerHTML = '<div class="error-box"><span>資料讀取失敗：' + (e.message || '請確認 Google Sheet 後端網址是否已設定正確') + '</span><button id="retryLoad">重試</button></div>';
      var btn = document.getElementById('retryLoad');
      if(btn) btn.addEventListener('click', loadEntries);
    }
  }
  async function saveEntryData(data, isUpdate){
    var res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免觸發 CORS 預檢，Apps Script 會自行解析 JSON
      body: JSON.stringify({ action: isUpdate ? 'update' : 'create', entry: data })
    });
    var json = await res.json();
    if(!json || !json.ok) throw new Error((json && json.error) ? json.error : '儲存失敗（後端未回傳錯誤訊息）');
    return json;
  }
  async function deleteEntryData(id){
    var res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id: id })
    });
    var json = await res.json();
    if(!json || !json.ok) throw new Error((json && json.error) ? json.error : '刪除失敗（後端未回傳錯誤訊息）');
    return json;
  }

  // ---------- BUILD STATIC UI (category chips / toggle) ----------
  var catChipsEl = document.getElementById('catChips');
  var allChip = document.createElement('button');
  allChip.className = 'cat-chip active';
  allChip.textContent = '全部類別';
  allChip.dataset.cat = 'all';
  allChip.style.background = 'var(--ink)';
  allChip.style.color = '#fff';
  catChipsEl.appendChild(allChip);
  CAT_ORDER.forEach(function(key){
    var c = CATS[key];
    var chip = document.createElement('button');
    chip.className = 'cat-chip';
    chip.dataset.cat = key;
    chip.innerHTML = '<span class="dot" style="background:' + c.hex + '"></span>' + c.label;
    catChipsEl.appendChild(chip);
  });
  catChipsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.cat-chip');
    if(!btn) return;
    state.category = btn.dataset.cat;
    Array.from(catChipsEl.children).forEach(function(c){
      var isActive = c === btn;
      c.classList.toggle('active', isActive);
      c.style.background = isActive && btn.dataset.cat !== 'all' ? CATS[btn.dataset.cat].hex : (isActive ? 'var(--ink)' : '');
      c.style.color = isActive ? '#fff' : '';
    });
    renderContent();
  });

  var catToggleEl = document.getElementById('catToggle');
  CAT_ORDER.forEach(function(key){
    var c = CATS[key];
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = c.label;
    btn.dataset.cat = key;
    btn.addEventListener('click', function(){ setFormCategory(key); });
    catToggleEl.appendChild(btn);
  });
  function setFormCategory(key){
    state.formCategory = key;
    Array.from(catToggleEl.children).forEach(function(btn){
      var active = btn.dataset.cat === key;
      btn.classList.toggle('is-active', active);
      btn.style.background = active ? CATS[key].hex : '#fff';
      btn.style.borderColor = active ? CATS[key].hex : '';
    });
  }
  setFormCategory('customs');

  // ---------- RENDER ----------
  function uniqueCountries(){
    var seen = {};
    var list = [];
    state.entries.forEach(function(e){
      var c = (e.country||'').trim();
      if(c && !seen[c]){ seen[c] = true; list.push(c); }
    });
    list.sort(function(a,b){ return a.localeCompare('zh-Hant'); });
    return list;
  }

  function renderAll(){
    renderStatStrip();
    renderCountryRow();
    renderContent();
    document.getElementById('countLine').textContent = '共 ' + state.entries.length + ' 則日誌';
  }

  function renderStatStrip(){
    var counts = { exit:0, customs:0, precaution:0, reflection:0 };
    state.entries.forEach(function(e){ if(counts.hasOwnProperty(e.category)) counts[e.category]++; });
    var strip = document.getElementById('statStrip');
    strip.innerHTML = CAT_ORDER.map(function(key){
      var c = CATS[key];
      return '<span class="item"><span class="dot" style="background:' + c.hex + '"></span>' + c.label + ' ' + counts[key] + '</span>';
    }).join('');
  }

  function renderCountryRow(){
    var row = document.getElementById('countryRow');
    var countries = uniqueCountries();
    var html = '<button class="pill' + (state.country === 'all' ? ' active' : '') + '" data-country="all">全部國家</button>';
    countries.forEach(function(c){
      html += '<button class="pill' + (state.country === c ? ' active' : '') + '" data-country="' + esc(c) + '">' + esc(c) + '</button>';
    });
    row.innerHTML = html;
    Array.from(row.children).forEach(function(btn){
      btn.addEventListener('click', function(){
        state.country = btn.dataset.country;
        renderCountryRow();
        renderContent();
      });
    });
  }

  function matches(e){
    if(state.country !== 'all' && (e.country||'').trim() !== state.country) return false;
    if(state.category !== 'all' && e.category !== state.category) return false;
    if(state.search){
      var q = state.search.toLowerCase();
      var hay = [e.country, e.region, e.title, e.content, e.companions].join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function formatDate(d){
    if(!d) return '';
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if(!m) return d; // 舊資料若不是標準格式，原樣顯示
    return m[1] + '年' + parseInt(m[2],10) + '月' + parseInt(m[3],10) + '日';
  }

  function metaLine(e){
    var parts = [];
    if(e.region) parts.push(e.region);
    if(e.date) parts.push(formatDate(e.date));
    if(e.companions) parts.push('與 ' + e.companions);
    return parts.join(' ・ ');
  }

  function renderContent(){
    var filtered = state.entries.filter(matches);

    if(state.entries.length === 0){
      content.innerHTML =
        '<div class="empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>' +
          '<h3>版面還是空的</h3>' +
          '<p>投稿第一則日誌，之後每趟旅行都能翻出來看。</p>' +
        '</div>';
      var emptyBtn = document.createElement('button');
      emptyBtn.className = 'btn-add';
      emptyBtn.style.margin = '0 auto';
      emptyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg> 投稿一則';
      emptyBtn.addEventListener('click', function(){ openForm(); });
      content.querySelector('.empty').appendChild(emptyBtn);
      return;
    }

    if(filtered.length === 0){
      content.innerHTML = '<div class="empty"><h3>這個版面還沒有稿子</h3><p>換個國家、分類或關鍵字看看。</p></div>';
      return;
    }

    var showLead = state.country === 'all' && state.category === 'all' && !state.search;
    var lead = showLead ? filtered[0] : null;
    var rest = lead ? filtered.slice(1) : filtered;

    var html = '';
    if(lead){
      var lc = CATS[lead.category] || CATS.customs;
      html += '<div class="lead" id="leadCard">' +
        '<div class="bar" style="background:' + lc.hex + '"></div>' +
        '<div>' +
          '<span class="latest-label">最新日誌</span>' +
          '<span class="lead-kicker" style="background:' + lc.hex + '">' + lc.label + ' ・ ' + esc(lead.country) + '</span>' +
          '<h2>' + esc(lead.title) + '</h2>' +
          '<p class="meta">' + esc(metaLine(lead)) + '</p>' +
          '<p class="excerpt">' + esc((lead.content||'').slice(0,120)) + '</p>' +
        '</div>' +
      '</div>';
    }

    html += '<div class="grid" id="cardGrid"></div>';
    content.innerHTML = html;

    if(lead){
      document.getElementById('leadCard').addEventListener('click', function(){ openDetail(lead.id); });
    }

    var grid = document.getElementById('cardGrid');
    rest.forEach(function(e){
      grid.appendChild(renderCard(e));
    });
  }

  function renderCard(e){
    var c = CATS[e.category] || CATS.customs;
    var card = document.createElement('div');
    card.className = 'card';
    card.style.borderLeftColor = c.hex;
    card.tabIndex = 0;
    card.setAttribute('role','button');
    card.innerHTML =
      '<span class="card-kicker" style="background:' + c.hex + '">' + c.label + '</span>' +
      '<p class="country-line">' + esc(e.country) + (e.region ? ' ・ ' + esc(e.region) : '') + '</p>' +
      '<h3>' + esc(e.title) + '</h3>' +
      '<p class="excerpt">' + esc(e.content || '（還沒有寫下內容）') + '</p>' +
      '<p class="meta">' + esc([formatDate(e.date), e.companions ? '與 ' + e.companions : ''].filter(Boolean).join(' ・ ')) + '</p>';
    card.addEventListener('click', function(){ openDetail(e.id); });
    card.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') openDetail(e.id); });
    return card;
  }

  // ---------- FORM ----------
  function openForm(entry){
    state.editingId = entry ? entry.id : null;
    document.getElementById('formTitle').textContent = entry ? '編輯這則日誌' : '投稿一則日誌';
    document.getElementById('fCountry').value = entry ? entry.country || '' : '';
    document.getElementById('fRegion').value = entry ? entry.region || '' : '';
    document.getElementById('fTitle').value = entry ? entry.title || '' : '';
    document.getElementById('fContent').value = entry ? entry.content || '' : '';
    document.getElementById('fDate').value = entry ? entry.date || '' : '';
    document.getElementById('fCompanions').value = entry ? entry.companions || '' : '';
    setFormCategory(entry ? entry.category : 'customs');
    formOverlay.classList.add('open');
    setTimeout(function(){ document.getElementById('fCountry').focus(); }, 50);
  }
  function closeForm(){
    formOverlay.classList.remove('open');
    entryForm.reset();
    state.editingId = null;
  }
  document.getElementById('btnAdd').addEventListener('click', function(){ openForm(); });
  document.getElementById('btnCloseFormTop').addEventListener('click', closeForm);
  formOverlay.addEventListener('click', function(e){ if(e.target === formOverlay) closeForm(); });

  entryForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var country = document.getElementById('fCountry').value.trim();
    var title = document.getElementById('fTitle').value.trim();
    if(!country){ document.getElementById('fCountry').focus(); return; }
    if(!title){ document.getElementById('fTitle').focus(); return; }

    var submitBtn = entryForm.querySelector('.btn-primary');
    submitBtn.disabled = true;
    submitBtn.textContent = '發布中…';

    var existing = state.editingId ? state.entries.find(function(x){ return x.id === state.editingId; }) : null;
    var data = {
      id: state.editingId || uid(),
      category: state.formCategory,
      country: country,
      region: document.getElementById('fRegion').value.trim(),
      title: title,
      content: document.getElementById('fContent').value.trim(),
      date: document.getElementById('fDate').value.trim(),
      companions: document.getElementById('fCompanions').value.trim(),
      createdAt: existing ? existing.createdAt : Date.now()
    };

    try{
      await saveEntryData(data, !!existing);
      closeForm();
      await loadEntries(); // 重新向後端確認最新資料，畫面只顯示真正寫入成功的內容
      showToast(existing ? '已更新這則日誌' : '已發布新的日誌');
    }catch(err){
      showToast('儲存失敗：' + err.message);
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = '發布';
    }
  });

  // ---------- DETAIL ----------
  function openDetail(id){
    var e = state.entries.find(function(x){ return x.id === id; });
    if(!e) return;
    state.deleteConfirmId = null;
    renderDetail(e);
    detailOverlay.classList.add('open');
  }
  function closeDetail(){
    detailOverlay.classList.remove('open');
    state.deleteConfirmId = null;
  }

  function renderDetail(e){
    var c = CATS[e.category] || CATS.customs;
    var footerHtml;
    if(state.deleteConfirmId === e.id){
      footerHtml =
        '<div class="confirm-row">確定要刪除這則日誌嗎？' +
          '<button type="button" class="btn-danger" id="btnConfirmDelete">確定刪除</button>' +
          '<button type="button" class="btn-secondary" id="btnCancelDelete">再想想</button>' +
        '</div><div></div>';
    } else {
      footerHtml =
        '<div class="left-actions">' +
          '<button type="button" class="btn-secondary" id="btnEditEntry">編輯</button>' +
          '<button type="button" class="btn-danger" id="btnDeleteEntry">刪除</button>' +
        '</div>' +
        '<button type="button" class="btn-primary" id="btnCloseDetail">關閉</button>';
    }

    detailSheet.innerHTML =
      '<span class="detail-kicker" style="background:' + c.hex + '">' + c.label + '</span>' +
      '<p class="detail-country">' + esc(e.country) + (e.region ? ' ・ ' + esc(e.region) : '') + '</p>' +
      '<h2 class="detail-title">' + esc(e.title) + '</h2>' +
      '<p class="detail-meta">' + esc([formatDate(e.date), e.companions ? '與 ' + e.companions : ''].filter(Boolean).join(' ・ ')) + '</p>' +
      '<p class="detail-body">' + esc(e.content || '還沒有寫下內容。') + '</p>' +
      '<div class="detail-footer">' + footerHtml + '</div>';

    var closeBtn = document.getElementById('btnCloseDetail');
    if(closeBtn) closeBtn.addEventListener('click', closeDetail);
    var editBtn = document.getElementById('btnEditEntry');
    if(editBtn) editBtn.addEventListener('click', function(){ closeDetail(); openForm(e); });
    var delBtn = document.getElementById('btnDeleteEntry');
    if(delBtn) delBtn.addEventListener('click', function(){ state.deleteConfirmId = e.id; renderDetail(e); });
    var cancelDelBtn = document.getElementById('btnCancelDelete');
    if(cancelDelBtn) cancelDelBtn.addEventListener('click', function(){ state.deleteConfirmId = null; renderDetail(e); });
    var confirmDelBtn = document.getElementById('btnConfirmDelete');
    if(confirmDelBtn) confirmDelBtn.addEventListener('click', async function(){
      confirmDelBtn.disabled = true;
      confirmDelBtn.textContent = '刪除中…';
      try{
        await deleteEntryData(e.id);
        closeDetail();
        await loadEntries(); // 重新向後端確認，畫面只顯示真正刪除成功後的內容
        showToast('已刪除這則日誌');
      }catch(err){
        showToast('刪除失敗：' + err.message);
        confirmDelBtn.disabled = false;
        confirmDelBtn.textContent = '確定刪除';
      }
    });
  }
  detailOverlay.addEventListener('click', function(e){ if(e.target === detailOverlay) closeDetail(); });

  // ---------- SEARCH ----------
  document.getElementById('searchInput').addEventListener('input', function(e){
    state.search = e.target.value.trim();
    renderContent();
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(formOverlay.classList.contains('open')) closeForm();
      if(detailOverlay.classList.contains('open')) closeDetail();
    }
  });

  loadEntries();
})();
</script>
</body>
</html>
